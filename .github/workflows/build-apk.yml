name: Build Nexus Mobilador Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codigo Fonte
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Executar Testes Unitarios JUnit
        run: gradle testDebugUnitTest

      - name: Compilar APK Debug e Release
        run: gradle assembleDebug assembleRelease

      - name: Publicar APK para Download nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexusMobiladorPro-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
